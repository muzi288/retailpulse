version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: retailpulse-inventory-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
